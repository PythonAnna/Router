<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Немецкий</title>
    <link rel="stylesheet" href="./static/local.css">
</head>
<body>
    <header>
      <button class="btn-dict btn-german">
        <img src="./static/img/ed8a3ff9e031796859864b6482550ab1 2.png" alt="Словарик" class="dict-icon" />
      </button>

      <div class="topic">
        <span class="title__span">Тема:</span>
        <input type="text" class="input-german" placeholder="Введите тему...">
        <button class="ok-header-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="12" x2="22" y2="2"/>
            <line x1="2" y1="12" x2="22" y2="22"/>
            <line x1="22" y1="2" x2="22" y2="22"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
          </svg>
        </button>
      </div>

      <div class="lang-menu-wrapper">
        <button class="btn-lang-menu">
          <svg width="28" height="22" viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect y="0" width="28" height="3" rx="1.5" fill="#000"/>
            <rect y="9" width="28" height="3" rx="1.5" fill="#000"/>
            <rect y="18" width="28" height="3" rx="1.5" fill="#000"/>
          </svg>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <a href="index.html" class="lang-option">EN Английский</a>
          <a href="german.html" class="lang-option active">DE Немецкий</a>
        </div>
      </div>
    </header>

    <div class="dict-german">
        <h3>Мой словарик</h3>
        <form class="dict-form">
            <input type="text" class="dict-input" placeholder="Слово">
            <input type="text" class="dict-input" placeholder="Перевод">
            <button type="submit" class="btn-add">Добавить</button>
        </form>
        <ul class="dict-list-german">
            <li class="dict-item">Hallo - Привет</li>
            <li class="dict-item">Danke - Спасибо</li>
            <li class="dict-item">Ja - Да</li>
            <li class="dict-item">Nein - Нет</li>
            <li class="dict-item">Auf Wiedersehen - До свидания</li>
        </ul>
        <button class="btn-close-german">✕ Закрыть</button>
    </div>

    <main class="main">
        <img src="./static/img/volk.png" alt="Volk" class="volk-image">
        <div class="chat-area">
          <div class="chat-wrapper" id="mainChat">
            <div class="chat-body">
              <form class="chat-form" id="chatForm">
                <input type="text" class="chat-input" id="chatInput" placeholder="Введите текст" />
              </form>
            </div>
          </div>
          <button type="submit" form="chatForm" class="chat-send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="2" y1="12" x2="22" y2="2"/>
              <line x1="2" y1="12" x2="22" y2="22"/>
              <line x1="22" y1="2" x2="22" y2="22"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
            </svg>
          </button>
        </div>

        <div class="dialog-area" id="dialogArea">
          <div class="dialog-msg dialog-left">
            <img src="./static/img/volk.png" alt="Volk" class="dialog-avatar" id="volkAvatar" />
            <div class="dialog-bubble">Текст который написал Волк</div>
          </div>
          <div class="dialog-msg dialog-right">
            <div class="dialog-bubble">Текст который сказал человек</div>
            <div class="dialog-avatar-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </div>
        </div>
    </main>

    <script src="german.js"></script>
</body>
</html>
