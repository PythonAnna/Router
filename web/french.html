<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Французский</title>
    <link rel="stylesheet" href="./static/local.css">
</head>
<body>

    <header>
        <button class="btn-french">Словарик</button>
        
        <div class="topic">
            <span>Тема:</span>
            <input type="text" class="input-french" placeholder="Введите тему...">
        </div>
        
        <a href="index.html" class="link">Перейти на англ →</a>
    </header>

    <div class="dict-french">
        <h3>Мой словарик</h3>
        <form class="dict-form">
            <input type="text" class="dict-input" placeholder="Слово">
            <input type="text" class="dict-input" placeholder="Перевод">
            <button type="submit" class="btn-add">Добавить</button>
        </form>
        <ul class="dict-list-french">
            <li class="dict-item">Bonjour - Здравствуйте</li>
            <li class="dict-item">Merci - Спасибо</li>
            <li class="dict-item">Oui - Да</li>
            <li class="dict-item">Non - Нет</li>
            <li class="dict-item">Au revoir - До свидания</li>
        </ul>
        <button class="btn-close-french">✕ Закрыть</button>
    </div>
    
    <div class="main">
        <div class="content">
        </div>
    </div>
    
    <script src="french.js"></script>
</body>
</html>
